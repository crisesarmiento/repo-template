name: Bug
description: Something is broken or behaves unexpectedly
labels: ["tipo:bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you observe?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Smallest set of steps, including commands, input, and environment (OS, version).
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: extras
    attributes:
      label: Logs, screenshots, or extra context
      description: Paste logs or attach screenshots if useful. Do not include secrets, tokens, or private data.
