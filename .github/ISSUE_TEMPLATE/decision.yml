name: Decision
description: A choice that must be approved before implementation (options A/B/C)
labels: ["necesita-decision"]
body:
  - type: markdown
    attributes:
      value: |
        Opening this issue does **not** authorize implementation. Wait until the
        decision is approved and the `decidida` label is applied.
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What needs to be decided, and why now?
    validations:
      required: true
  - type: textarea
    id: option-a
    attributes:
      label: Option A
      description: Describe the option and its main consequences.
    validations:
      required: true
  - type: textarea
    id: option-b
    attributes:
      label: Option B
      description: Describe the option and its main consequences.
    validations:
      required: true
  - type: textarea
    id: option-c
    attributes:
      label: Option C
      description: Describe the option and its main consequences. Use this for a third path, a deferral, or "do nothing for now".
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Tradeoffs
      description: Compare the options. What does each gain or give up?
    validations:
      required: true
  - type: textarea
    id: recommendation
    attributes:
      label: Recommendation
      description: Which option do you recommend, and why?
    validations:
      required: true
  - type: textarea
    id: follow-up
    attributes:
      label: If approved
      description: What work follows, and what this decision does not authorize?
