name: Feature
description: Propose a new capability or an improvement
labels: ["tipo:feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or goal
      description: What problem does this solve, or what should become possible?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How should it work? Keep the first version as small as you can.
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: Observable, testable bullets that would mean the work is done.
      placeholder: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and exclusions
      description: What is in scope, and what is explicitly out of scope?
  - type: textarea
    id: references
    attributes:
      label: References (optional)
      description: Related issues, docs, or links.
